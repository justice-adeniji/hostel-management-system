<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Student</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-container narrow">

<h1>Create Student Account</h1>

<form class="form-card"
      th:action="@{/students/create}"
      th:object="${student}"
      method="post">

    <div class="form-group">

        <label for="firstName">
            First Name
        </label>

        <input type="text"
               id="firstName"
               th:field="*{firstName}">

        <div class="error"
             th:if="${#fields.hasErrors('firstName')}"
             th:errors="*{firstName}">
        </div>

    </div>

    <div class="form-group">

        <label for="lastName">
            Last Name
        </label>

        <input type="text"
               id="lastName"
               th:field="*{lastName}">

        <div class="error"
             th:if="${#fields.hasErrors('lastName')}"
             th:errors="*{lastName}">
        </div>

    </div>

    <div class="form-group">

        <label for="matricNumber">
            Matric Number
        </label>

        <input type="text"
               id="matricNumber"
               th:field="*{matricNumber}">

        <div class="error"
             th:if="${#fields.hasErrors('matricNumber')}"
             th:errors="*{matricNumber}">
        </div>

    </div>

    <div class="form-group">

        <label for="email">
            Email
        </label>

        <input type="email"
               id="email"
               th:field="*{email}">

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>

    </div>

    <div class="form-group">

        <label for="phoneNumber">
            Phone Number
        </label>

        <input type="text"
               id="phoneNumber"
               th:field="*{phoneNumber}">

        <div class="error"
             th:if="${#fields.hasErrors('phoneNumber')}"
             th:errors="*{phoneNumber}">
        </div>

    </div>

    <div class="form-group">

        <label for="department">
            Department
        </label>

        <input type="text"
               id="department"
               th:field="*{department}">

        <div class="error"
             th:if="${#fields.hasErrors('department')}"
             th:errors="*{department}">
        </div>

    </div>

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input type="password"
               id="password"
               th:field="*{password}">

        <div class="error"
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}">
        </div>

    </div>

    <div class="form-actions">

        <button type="submit">
            Create Student
        </button>

        <a href="/students" class="back">
            Cancel
        </a>

    </div>

</form>

</main>

</body>
</html>
